name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-pc-windows-gnu, os: windows-2022 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: echo "PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install cross-compilation target
        if: matrix.job.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: rustup target add x86_64-apple-darwin

      - name: Build precompiled NIF
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: signer_nif
          project-dir: native/signer
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          variant: ""

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *signer_nif-*.tar.gz

  # Aggregate gate. `fail-fast: false` above means a partial matrix still
  # produces a release that *looks* complete, so refuse to call the build good
  # unless every job succeeded and the committed checksum file matches the tag.
  verify_release:
    name: Verify release artifacts
    needs: build_release
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Fail if any NIF build failed
        if: needs.build_release.result != 'success'
        run: |
          echo "::error::One or more NIF matrix jobs did not succeed (${{ needs.build_release.result }})."
          echo "The GitHub release is incomplete; do not publish to Hex."
          exit 1

      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1"
          # builds.hex.pm now serves a Let's Encrypt "Root YR" chain whose root
          # carries an extendedKeyUsage; OTP's public_key rejects it with
          # `key_usage_mismatch`, so `mix local.rebar` dies before any step
          # runs. Give setup-beam a second mirror to fall back to.
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      # Asserts the committed checksum file covers the full matrix and is for
      # the version in mix.exs. Regenerate it with
      # `mix rustler_precompiled.download Hyperliquid.Signer --all` and commit
      # before publishing.
      # Bootstrap escape hatch. The checksum file can only be generated *from*
      # this very build (`mix rustler_precompiled.download --all` downloads the
      # release assets), so on the FIRST tag of a new version it is necessarily
      # still describing the previous version and this gate could never pass.
      # Detect that case and skip, rather than failing a build that is fine.
      # The strict check is not lost: ci.yml runs the same script on every push
      # and PR, so the regenerated file still has to land before merge/publish.
      - name: Does the checksum file already cover this tag?
        id: checksum_state
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if grep -q -- "-v${version}-nif-" checksum-Elixir.Hyperliquid.Signer.exs; then
            echo "covers=true" >> "$GITHUB_OUTPUT"
          else
            echo "covers=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify NIF checksum file
        if: steps.checksum_state.outputs.covers == 'true'
        run: elixir scripts/verify_nif_checksums.exs

      - name: Checksum file not yet generated for this tag
        if: steps.checksum_state.outputs.covers != 'true'
        run: |
          echo "::notice::checksum-Elixir.Hyperliquid.Signer.exs has no entries for ${GITHUB_REF_NAME} — this is the first build of this version, so the file cannot exist yet. Skipping the checksum gate. Regenerate it now with 'mix rustler_precompiled.download Hyperliquid.Signer --all --print', commit it, and let ci.yml enforce the strict check."
